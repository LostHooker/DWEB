<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Happy Pack</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" media="all" href="../static/css/gtvg.css" th:href="@{/css/gtvg.css}" />
    <link rel="icon" type="image/x-icon" href="/images/happyPackLogo.ico"/>
</head>

  <body>

  <header class="site-header" th:insert="~{fragments :: header}"></header>

    <main class="page">
      <div class="page-header">
        <p class="eyebrow">Cuentas</p>
        <h1>Clientes</h1>
        <p class="lead">Listado de clientes registrados en la tienda.</p>
      </div>


      <section class="data-grid" aria-label="Lista de clientes">
        <div class="grid-row grid-row--head customer-grid">
          <span>Nombre</span>
          <span>Email</span>
          <span>Cliente desde</span>
          <span>Acciones</span>
        </div>

        <article class="grid-row customer-grid" th:each="customer : ${customers}">
          <strong>Cliente</strong>
          <a>cliente@example.com</a>
          <span>13 ene 2011</span>
          <span>
            
          </span>
        </article>
      </section>
    </main>

  <footer class="site-footer" th:replace="~{fragments :: footer}"></footer>


  </body>

</html>
