<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

 <head th:replace="~{fragments :: siteHead}"></head>

  <body>

  <header class="site-header" th:insert="~{fragments :: header}"></header>

    <main class="page">
      <div class="page-header">
        <p class="eyebrow">Catálogo</p>
        <h1>Productos</h1>
        <p class="lead">Listado de artículos promocionales con precio, disponibilidad y comentarios de clientes.</p>
      </div>

      <section class="data-grid" aria-label="Lista de productos">
        <div class="grid-row grid-row--head product-grid">
            <span>Nº</span>
            <span>Nombre</span>
          <span class="number">Precio</span>
        </div>

        <article class="grid-row product-grid" th:each="prod, iterStat : ${prods}">
            <span th:text="${iterStat.count}">1</span>
          <strong th:text="${prod.name}">Bolsa de tela reutilizable</strong>
          <span class="number" th:text="${prod.price + ' €'}">2.50 €</span>
        </article>
      </section>
    </main>
  
      <footer class="site-footer" th:replace="~{fragments :: footer}"></footer>


  </body>

</html>
